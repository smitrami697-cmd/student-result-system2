<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Leaderboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <nav>

        <div class="logo">
            🎓 StudentRank
        </div>

        <a href="/leaderboard">
            View Leaderboard 🏆
        </a>

    </nav>


    <section class="hero">

        <div class="hero-text">

            <h1>
                Student <span>Leaderboard</span>
            </h1>

            <p>
                Upload your marksheet and enter your academic details
                to join the leaderboard.
            </p>

        </div>


        <div class="form-card">

            <h2>📄 Submit Your Result</h2>

            <p class="subtitle">
                Enter your details below
            </p>


            <form action="/add_student"
                  method="POST"
                  enctype="multipart/form-data">


                <label>Student Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >


                <label>Enrollment Number</label>

                <input
                    type="text"
                    name="enrollment"
                    placeholder="Enter enrollment number"
                    required
                >


                <label>Semester</label>

                <select name="semester" required>

                    <option value="">
                        Select Semester
                    </option>

                    <option value="1">
                        Semester 1
                    </option>

                    <option value="2">
                        Semester 2
                    </option>

                    <option value="3">
                        Semester 3
                    </option>

                    <option value="4">
                        Semester 4
                    </option>

                    <option value="5">
                        Semester 5
                    </option>

                    <option value="6">
                        Semester 6
                    </option>

                </select>


                <label>SGPA / CGPA</label>

                <input
                    type="number"
                    name="sgpa"
                    placeholder="Example: 8.75"
                    min="0"
                    max="10"
                    step="0.01"
                    required
                >


                <label>Upload Marksheet</label>

                <div class="upload-box">

                    <input
                        type="file"
                        name="marksheet"
                        accept=".pdf,.jpg,.jpeg,.png"
                        required
                    >

                    <p>
                        📎 PDF, JPG, JPEG or PNG
                    </p>

                </div>


                <button type="submit">

                    Submit Result 🚀

                </button>

            </form>

        </div>

    </section>

</body>

</html>
